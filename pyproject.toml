[project]
name = "commonmind-lint"
version = "1.1.0"
description = "Linter for Commonmind LLM wikis (OKF v0.2 profile)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.scripts]
commonmind-lint = "commonmind_lint.cli:main"
commonmind-inventory = "commonmind_lint.inventory:main"
commonmind-migrate = "commonmind_lint.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commonmind_lint"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "commonmind_lint/schema"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
